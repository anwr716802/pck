<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الدليل</title>

<style>
body { font-family: Arial; direction: rtl; padding:20px; }
.card { border:1px solid #ccc; padding:10px; margin:10px 0; }
img { width:100px; height:100px; object-fit:cover; }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <span class="logo">متجر الشعب</span>
</div>

<div class="container" id="list"></div>
<h2>قائمة الأشخاص</h2>
<div id="list"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby6k3CcS_hCbcKXHffBGjucwGtu87-vRVZ4f9sjnzLByTmC9dUaMoP09zgNXZd1fCvNeg/exec?action=get";

fetch(API_URL)
  .then(res => res.json())
  .then(data => {

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(item => {
      list.innerHTML += `
        <div class="card">
          <img src="${item.image}">
          <div class="card-body">
            <div class="name">${item.name}</div>
            <div class="price">${item.job} ريال</div>
            <a class="btn" target="_blank"
              href="https://wa.me/${item.phone}?text=اريد شراء ${item.name}">
              اطلب الآن
            </a>
          </div>
        </div>
      `;
    });

  })
  .catch(err => {
    console.log(err);
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
