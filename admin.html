<!DOCTYPE html>
<html lang="ar">
<head>
  <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<title>لوحة التحكم</title>
</head>
<body>

<h2>إضافة شخص</h2>

<input id="name" placeholder="اسم المنتج">
<input id="job" placeholder="السعر">
<input id="phone" placeholder="رقم الواتساب">

<input type="file" id="image"><br><br>

<button onclick="send()">حفظ</button>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby6k3CcS_hCbcKXHffBGjucwGtu87-vRVZ4f9sjnzLByTmC9dUaMoP09zgNXZd1fCvNeg/exec";
const TOKEN = "123456";

const CLOUD_NAME = "dxjzks7xl";
const UPLOAD_PRESET = "myupload";

function send() {

  const file = document.getElementById("image").files[0];

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(imgData => {

    const imageUrl = imgData.secure_url;

    return fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        token: TOKEN,
        action: "add",
        name: document.getElementById("name").value,
        job: document.getElementById("job").value,
        phone: document.getElementById("phone").value,
        image: imageUrl,
        status: "published"
      })
    });

  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("تم الحفظ");
    } else {
      alert("فشل");
    }
  })
  .catch(err => {
    alert("خطأ: " + err);
  });
}
</script>
</script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
